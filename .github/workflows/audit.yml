name: Audit Dependencies

on:
  push:
    paths:
      - ".github/workflows/audit.yml"
      - "go.mod"
      - "go.sum"
  # Rerun periodically to pick up new advisories.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        run: govulncheck ./...

  nocgo:
    name: No CGO in dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # R13 is a supply-chain property, not just a build flag: a new dependency
      # can introduce CGO without any local build failing under CGO_ENABLED=0.
      # Running the architecture test here means a dependency bump PR trips it.
      - run: go test ./tools/...
