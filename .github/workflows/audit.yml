name: Audit Dependencies

on:
    push:
        # What this workflow does is no longer defined by this file alone. The
        # toolchain comes from mise, and the scan itself is a just recipe, so a
        # change to any of them changes the audit without touching audit.yml.
        # Before the mise switch the toolchain came from go.mod, which was
        # already listed here; dropping mise.toml and the justfile would leave
        # that gap open.
        paths:
            - ".github/workflows/audit.yml"
            - "justfile"
            - "mise.toml"
            - "mise.lock"
            - "go.mod"
            - "go.sum"
    # Rerun periodically to pick up new advisories.
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: read

env:
    # R13: no CGO anywhere in the dependency graph.
    CGO_ENABLED: "0"

# Every job installs its toolchain through mise, matching the rest of this
# repository's workflows and the reference repository (EvilBit-Labs/opnDossier).
#
# This workflow used actions/setup-go with `go-version-file: go.mod`, which is
# what CI's own comment warns against: go.mod states a *language level*, not a
# toolchain. go.mod says 1.26.1 while mise.toml pins 1.26.5, and setup-go also
# sets GOTOOLCHAIN=local, so the scan ran against a Go 1.26.1 standard library
# and reported nine stdlib advisories already fixed in 1.26.2 through 1.26.5.
# The identical `govulncheck ./...` in security.yml passed the whole time,
# because that workflow installs its toolchain through mise.
jobs:
    govulncheck:
        name: govulncheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # mise.toml declares govulncheck and mise.lock records the version
            # it resolved to, so mise install produces the same binary CI ran
            # last time. The `go install ...@latest` step that used to sit here
            # re-resolved on every run and built against the ambient toolchain,
            # which is the drift this workflow was just fixed for -- a scanner
            # chosen at job time cannot be reasoned about after the fact.
            #
            # This is not GOTCHAS 4.3: that entry is about a stale $GOPATH/bin
            # copy shadowing a pinned one, and says outright that CI was
            # unaffected because a fresh runner has nothing to shadow with.
            - name: Vulnerability scan
              run: just vuln

    nocgo:
        name: No CGO in dependency graph
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # R13 is a supply-chain property, not just a build flag: a new dependency
            # can introduce CGO without any local build failing under CGO_ENABLED=0.
            # Running the architecture test here means a dependency bump PR trips it.
            - run: go test ./tools/...
