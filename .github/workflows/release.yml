# Release workflow for DBSurveyor
#
# Triggered by pushing a semver tag (e.g. v0.1.0).
#
# Builds two binaries across five platforms with GoReleaser, signs the checksum
# file with Cosign (keyless), and generates an SBOM with Syft.
#
# The Rust release needed a pinned toolchain with six explicitly named targets,
# mingw for Windows, and musl-tools for static Linux. None of that is here: the
# Go toolchain cross-compiles to every target it supports out of the box, and
# CGO_ENABLED=0 makes the Linux build static without a second libc.

name: Release

on:
    push:
        tags:
            - "v*.*.*"

env:
    # R13: no CGO anywhere in the dependency graph.
    CGO_ENABLED: "0"

jobs:
    validate:
        name: Quality Gate
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              run: go build ./...
            - name: Vet
              run: go vet ./...
            - name: Lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: latest
                  args: --timeout=10m
            - name: Check formatting
              run: golangci-lint fmt --diff
            - name: Test
              run: go test ./...
              env:
                  TERM: dumb

    release:
        needs: validate
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Install Cosign
              uses: sigstore/cosign-installer@v4

            - name: Install Syft
              uses: anchore/sbom-action/download-syft@v0

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@v7
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

            # The no-CGO rule is checked at the source level by
            # tools/nocgo_test.go, which cannot see a build setting lost to a
            # stray environment variable on this runner. This checks the other
            # end: what the binaries were actually built with. It is inlined
            # rather than calling `just verify-artifacts` so the release job
            # needs no task runner installed.
            - name: Verify the artifacts are static and reproducible
              run: |
                  set -euo pipefail
                  found=0
                  while IFS= read -r binary; do
                      found=$((found + 1))
                      settings=$(go version -m "$binary")
                      grep -q 'CGO_ENABLED=0' <<<"$settings" || {
                          echo "FAIL: $binary was not built with CGO_ENABLED=0"
                          exit 1
                      }
                      grep -q -- '-trimpath=true' <<<"$settings" || {
                          echo "FAIL: $binary was not built with -trimpath"
                          exit 1
                      }
                      echo "ok: $binary"
                  done < <(find dist -type f -regex '.*/dbsurveyor\(-collect\)?\(\.exe\)?$')
                  if [ "$found" -eq 0 ]; then
                      echo "FAIL: no binaries found under dist/"
                      exit 1
                  fi
                  echo "verified $found binaries"

            - name: Attest build provenance
              uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
              with:
                  subject-path: "dist/**/*"
