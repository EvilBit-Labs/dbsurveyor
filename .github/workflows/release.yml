# Release workflow for DBSurveyor
#
# Triggered by pushing a semver tag (e.g. v0.1.0).
#
# Builds two binaries across five platforms with GoReleaser, signs the checksum
# file with Cosign (keyless), and generates an SBOM with Syft.
#
# The Rust release needed a pinned toolchain with six explicitly named targets,
# mingw for Windows, and musl-tools for static Linux. None of that is here: the
# Go toolchain cross-compiles to every target it supports out of the box, and
# CGO_ENABLED=0 makes the Linux build static without a second libc.

name: Release

on:
    push:
        tags:
            - "v*.*.*"

env:
    # R13: no CGO anywhere in the dependency graph.
    CGO_ENABLED: "0"

jobs:
    validate:
        name: Quality Gate
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # mise.toml is where this project pins Go, golangci-lint,
            # govulncheck, and goreleaser, so the release runs the same
            # toolchain a contributor does. See the note in ci.yml.
            - name: Setup mise toolchain
              uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build
              run: go build ./...
            - name: Vet
              run: go vet ./...
            - name: Lint
              run: just lint
            - name: Check formatting
              run: just format-check
            - name: Test
              run: just test
              env:
                  TERM: dumb

    release:
        needs: validate
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: Setup mise toolchain
              uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # mise.toml sets lockfile = true, so installing tools rewrites
            # mise.lock and leaves the tree dirty. GoReleaser refuses to build a
            # dirty tree, so the release would fail on a file the toolchain
            # installer wrote rather than on anything a human changed.
            - name: Reset mise.lock to avoid a dirty-tree failure
              run: git checkout -- mise.lock || true

            - name: Install Cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

            - name: Install Syft
              uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

            # The no-CGO rule is checked at the source level by
            # tools/nocgo_test.go, which cannot see a build setting lost to a
            # stray environment variable on this runner. This checks the other
            # end: what the binaries were actually built with.
            - name: Verify the artifacts are static and reproducible
              run: just verify-artifacts

            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
              with:
                  subject-path: "dist/**/*"
