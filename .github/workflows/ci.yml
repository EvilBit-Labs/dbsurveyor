name: CI

on:
  push:
    branches: [main, go-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # R13: no CGO anywhere in the dependency graph.
  CGO_ENABLED: "0"

jobs:
  build:
    name: Build and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m
      - name: Check formatting
        # Checked separately so a formatting-only failure is distinguishable
        # from a lint failure in the job log.
        run: golangci-lint fmt --diff

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  # The adapter suites drive real PostgreSQL and MySQL servers through
  # Testcontainers. They sit behind the `integration` build tag so the matrix
  # job above needs no container runtime, and run here on Linux only, where a
  # Docker daemon is available to the runner.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags integration -timeout 20m ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Enforce threshold
        # The Go tree starts from zero coverage; this floor rises as phases
        # land rather than importing the Rust tree's 55% number.
        run: |
          pct=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          echo "coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p < 50) { print "FAIL: below 50% threshold"; exit 1 } }'
