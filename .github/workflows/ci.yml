name: CI

on:
    push:
        branches: [main, go-port]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # R13: no CGO anywhere in the dependency graph.
    CGO_ENABLED: "0"

# Every job installs its toolchain through mise, matching the reference
# repository (EvilBit-Labs/opnDossier) and the rest of this repository's
# workflows.
#
# mise.toml is where this project pins its versions -- Go, golangci-lint,
# govulncheck, goreleaser, just -- so using it here is what makes CI run the
# toolchain a contributor runs locally. actions/setup-go with go-version-file
# would take the version from go.mod instead, which states a language level
# rather than a toolchain: go.mod says 1.26.1 while mise.toml pins 1.26.5, so
# the two would silently disagree.
#
# The jobs run `just` recipes rather than raw commands, so a contributor
# reproducing a CI failure runs the same thing CI ran.
jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Lint
              run: just lint
            - name: Check formatting
              # Checked separately so a formatting-only failure is
              # distinguishable from a lint failure in the job log.
              run: just format-check

    build:
        name: Build and vet
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify go.mod is tidy
              run: |
                  go mod tidy
                  git diff --exit-code -- go.mod go.sum
            - run: go build ./...
            - run: go vet ./...
            - name: Cross-compile check
              # The release builds five platform pairs from one runner. A
              # compile error on a platform nobody develops on should surface
              # here rather than during a release.
              run: |
                  for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
                      GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/... || exit 1
                  done

    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        needs: lint
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Test
              run: just test
              env:
                  # A report must render identically whatever produced it, and
                  # this is where a terminal-dependent difference would show.
                  TERM: dumb

    # The adapter suites drive real PostgreSQL, MySQL, SQL Server, Oracle, and
    # MongoDB servers through Testcontainers. They sit behind the `integration`
    # build tag so the matrix job above needs no container runtime, and run here
    # on Linux only, where a Docker daemon is available to the runner.
    integration:
        name: Integration
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Integration tests
              run: just test-integration

    vuln:
        name: Vulnerabilities
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # A vulnerability reachable from this code is a different thing from
            # one that merely exists in the graph, and only govulncheck tells
            # them apart. It runs per change rather than per release so the
            # distinction is visible while the change that introduced it is
            # still in hand.
            - name: Vulnerability scan
              run: just vuln

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run coverage
              run: go test -coverprofile=coverage.out -covermode=atomic ./...

            - name: Enforce threshold
              # The Go tree starts from zero coverage; this floor rises as
              # phases land rather than importing the Rust tree's 55% number.
              run: |
                  pct=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+' | tail -1)
                  echo "coverage: ${pct}%"
                  awk -v p="$pct" 'BEGIN { if (p < 50) { print "FAIL: below 50% threshold"; exit 1 } }'

            - name: Upload to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage.out
                  # Dependabot pull requests run without access to
                  # CODECOV_TOKEN, so a tokenless upload to a protected branch
                  # is rejected. The threshold above already gates the job.
                  fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}
