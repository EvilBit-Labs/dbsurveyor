name: Security

on:
    pull_request:
        branches: [main]
    workflow_run:
        workflows: [CI]
        types: [completed]
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # govulncheck reports only vulnerabilities in code paths the binary
            # actually reaches, so an advisory against a function no code here
            # calls does not stop a release. The Rust tooling it replaces had no
            # equivalent, which is why that tree carried a hand-maintained list
            # of advisory suppressions in two files that had to be kept in sync.
            - name: Vulnerability scan
              run: govulncheck ./...

            # go mod tidy leaving the manifest dirty means a dependency was
            # added or dropped without the lock being updated to match.
            - name: Verify go.mod is tidy
              run: |
                  go mod tidy
                  git diff --exit-code -- go.mod go.sum
