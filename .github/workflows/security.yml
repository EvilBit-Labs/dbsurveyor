name: Security

on:
    pull_request:
        branches: [main]
    workflow_run:
        workflows: [CI]
        types: [completed]
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        # Named explicitly because the job id alone renders as a bare "audit" in
        # the PR check list, which is where this went wrong once: the failing
        # dependency scan was called "govulncheck", and a reviewer looking for
        # "did the audit pass" found this green "audit" and stopped. Two checks
        # covering the same ground need names that say which is which.
        name: Dependency audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # govulncheck reports only vulnerabilities in code paths the binary
            # actually reaches, so an advisory against a function no code here
            # calls does not stop a release. The Rust tooling it replaces had no
            # equivalent, which is why that tree carried a hand-maintained list
            # of advisory suppressions in two files that had to be kept in sync.
            #
            # Run through the just recipe rather than calling govulncheck
            # directly, so a contributor reproducing a failure runs what CI ran.
            # It also picks up the CGO_ENABLED=0 the justfile exports, which a
            # bare invocation here did not.
            - name: Vulnerability scan
              run: just vuln

            # go mod tidy leaving the manifest dirty means a dependency was
            # added or dropped without the lock being updated to match.
            - name: Verify go.mod is tidy
              run: |
                  go mod tidy
                  git diff --exit-code -- go.mod go.sum
