name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup summary
              run: |
                  echo "DBSurveyor development environment setup complete."
                  echo ""
                  echo "Available tools:"
                  echo "  - Go: $(go version)"
                  echo "  - golangci-lint: $(golangci-lint --version)"
                  echo "  - govulncheck: $(govulncheck -version | head -1)"
                  echo "  - just: $(just --version)"
                  echo "  - goreleaser: $(goreleaser --version | head -1)"
