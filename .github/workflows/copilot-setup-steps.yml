name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup summary
              run: |
                  echo "DBSurveyor development environment setup complete."
                  echo ""
                  echo "Available tools:"
                  echo "  - Go: $(go version)"
                  echo "  - golangci-lint: $(golangci-lint --version)"
                  echo "  - govulncheck: $(govulncheck -version | head -1)"
                  echo "  - just: $(just --version)"
                  echo "  - goreleaser: $(goreleaser --version | head -1)"
