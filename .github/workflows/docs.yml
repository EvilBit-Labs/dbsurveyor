name: Deploy Documentation

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup mdBook
              uses: jontze/action-mdbook@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  mdbook-version: latest
                  use-mermaid: true
                  use-toc: true
                  use-admonish: true
            # The mdbook preprocessors this book uses come from mise.toml, which
            # the mise-action step above has already installed. The cargo
            # binstall step that used to sit here went with the Rust workspace:
            # nothing installs cargo-binstall any more, so it failed outright.

            - name: Build mdBook
              run: |
                  cd docs
                  mdbook build

            # The rustdoc step that used to run here is gone with the Rust
            # workspace. Go's package documentation is served by pkg.go.dev from
            # the published module rather than built and hosted here, and the
            # packages are internal/, which pkg.go.dev does not index. The
            # format specifications under docs/formats are the reference an
            # implementer needs, and mdBook already publishes those.

            - name: Setup Pages
              if: github.ref == 'refs/heads/main'
              uses: actions/configure-pages@v6

            - name: Upload artifact
              if: github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/book

    deploy:
        if: github.ref == 'refs/heads/main'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
