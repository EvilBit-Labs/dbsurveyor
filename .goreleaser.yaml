# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
#
# GoReleaser v2 configuration for DBSurveyor.
#
# Two binaries, five platforms, one archive per platform.
#
# The Rust configuration this replaces built seven variants, because database
# drivers were compile-time feature gates and a build had to choose which ones
# to include. Every Go driver is pure Go (R13), so all of them are in every
# binary and there is nothing left to choose. The same reasoning removes the
# separate musl target: a CGO_ENABLED=0 Go binary is already statically linked
# on Linux, so the glibc build runs on Alpine unchanged.

version: 2

project_name: dbsurveyor

before:
    hooks:
        - go mod download

# ---------------------------------------------------------------------------
# Builds
#
# CGO_ENABLED=0 is repository policy (R13), not a cross-compilation
# convenience: pure-Go drivers are what let an operator drop a single binary
# into an airgapped host with no vendor client libraries present.
# ---------------------------------------------------------------------------
builds:
    - id: dbsurveyor
      binary: dbsurveyor
      main: ./cmd/dbsurveyor
      env:
          - CGO_ENABLED=0
      goos: [linux, darwin, windows]
      goarch: [amd64, arm64]
      ignore:
          # Windows on ARM64 is not a platform this tool is asked for, and
          # shipping an untested binary is worse than not shipping one.
          - goos: windows
            goarch: arm64
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X main.version={{ .Version }}
          - -X main.commit={{ .FullCommit }}
          - -X main.date={{ .CommitDate }}
      mod_timestamp: "{{ .CommitTimestamp }}"

    - id: dbsurveyor-collect
      binary: dbsurveyor-collect
      main: ./cmd/dbsurveyor-collect
      env:
          - CGO_ENABLED=0
      goos: [linux, darwin, windows]
      goarch: [amd64, arm64]
      ignore:
          - goos: windows
            goarch: arm64
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X main.version={{ .Version }}
          - -X main.commit={{ .FullCommit }}
          - -X main.date={{ .CommitDate }}
      mod_timestamp: "{{ .CommitTimestamp }}"

# ---------------------------------------------------------------------------
# Archives
#
# One archive per platform holding both binaries. Neither is useful without the
# other: the collector produces artifacts the postprocessor reads.
# ---------------------------------------------------------------------------
archives:
    - id: dbsurveyor
      ids:
          - dbsurveyor
          - dbsurveyor-collect
      formats:
          - tar.gz
      name_template: >-
          {{ .ProjectName }}_
          {{- title .Os }}_
          {{- if eq .Arch "amd64" }}x86_64
          {{- else }}{{ .Arch }}{{ end }}
      format_overrides:
          - goos: windows
            formats:
                - zip
      files:
          - LICENSE*
          - README.md
          - src: docs/formats/*.md
            dst: docs/formats
      builds_info:
          mtime: "{{ .CommitTimestamp }}"

# ---------------------------------------------------------------------------
# Checksums
# ---------------------------------------------------------------------------
checksum:
    name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
    algorithm: sha256

# ---------------------------------------------------------------------------
# Changelog
# ---------------------------------------------------------------------------
changelog:
    sort: asc
    filters:
        exclude:
            - "^docs:"
            - "^test:"
            - "^chore:"
            - "^ci:"
            - "^style:"

# ---------------------------------------------------------------------------
# SBOM (Software Bill of Materials)
# ---------------------------------------------------------------------------
sboms:
    - artifacts: archive

# ---------------------------------------------------------------------------
# Signing (Cosign keyless)
# ---------------------------------------------------------------------------
signs:
    - cmd: cosign
      certificate: "${artifact}.pem"
      args:
          - sign-blob
          - "--output-certificate=${certificate}"
          - "--output-signature=${signature}"
          - "${artifact}"
          - "--yes"
      artifacts: checksum

# ---------------------------------------------------------------------------
# Linux packages
# ---------------------------------------------------------------------------
nfpms:
    - id: dbsurveyor
      ids:
          - dbsurveyor
          - dbsurveyor-collect
      file_name_template: "{{ .ConventionalFileName }}"
      maintainer: UncleSp1d3r
      homepage: https://evilbitlabs.io/dbsurveyor
      description: Secure database schema documentation and analysis tool
      license: Apache-2.0
      formats:
          - deb
          - rpm
          - apk
      bindir: /usr/bin

# ---------------------------------------------------------------------------
# Homebrew Cask
# ---------------------------------------------------------------------------
homebrew_casks:
    - name: dbsurveyor
      ids:
          - dbsurveyor
      repository:
          owner: EvilBit-Labs
          name: homebrew-tap
          token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      directory: Casks
      homepage: https://evilbitlabs.io/dbsurveyor
      description: Secure database schema documentation and analysis tool
      binaries:
          - dbsurveyor
          - dbsurveyor-collect
      commit_author:
          name: goreleaserbot
          email: bot@goreleaser.com
      commit_msg_template: "chore(brew): update {{ .ProjectName }} cask to {{ .Tag }}"

# ---------------------------------------------------------------------------
# Release
# ---------------------------------------------------------------------------
release:
    github:
        owner: EvilBit-Labs
        name: dbsurveyor
    prerelease: auto
    footer: |
        **Full Changelog**: https://github.com/EvilBit-Labs/dbsurveyor/compare/{{ .PreviousTag }}...{{ .Tag }}

        ## Contents

        Every archive holds both binaries:

        | Binary | Role |
        |--------|------|
        | `dbsurveyor-collect` | connects to a database and writes a schema artifact |
        | `dbsurveyor` | reads an artifact and renders a report |

        Every database driver is compiled into `dbsurveyor-collect`; there are no
        per-driver variants to choose between. The binaries are statically linked
        and have no runtime dependencies, so the Linux build runs on Alpine as
        well as on glibc distributions.

        ## Installation

        ### Homebrew (macOS / Linux)
        ```bash
        brew install EvilBit-Labs/tap/dbsurveyor
        ```

        ### Download Binary
        Download the archive for your platform from the assets below.

        ### Verify Checksums
        ```bash
        sha256sum -c dbsurveyor_{{ .Version }}_checksums.txt
        ```

        ### Verify Signatures
        ```bash
        cosign verify-blob \
          --certificate-identity-regexp="https://github.com/EvilBit-Labs/dbsurveyor/.*" \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
          --certificate dbsurveyor_{{ .Version }}_checksums.txt.pem \
          --signature dbsurveyor_{{ .Version }}_checksums.txt.sig \
          dbsurveyor_{{ .Version }}_checksums.txt
        ```

# Source tarball (disabled -- use git clone instead)
source:
    enabled: false
