# .pre-commit-config.yaml

repos:
    # 🧼 Standard code cleanup hooks (language agnostic)
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
            args: ["--maxkb=1024"]
            exclude: |
                (?x)^(
                        \.sql$|
                        \.dump$|
                        \.sqlite$|
                        \.db$
                )$
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: check-illegal-windows-names
          - id: check-json
            types: [json]
          - id: check-toml
            types: [toml]
          - id: check-yaml
            types: [yaml]
            args: [--allow-multiple-documents]
          - id: check-xml
            types: [xml]
          - id: mixed-line-ending
            args: [--fix=auto]
            types: [text]
          - id: check-vcs-permalinks

    # Go linting (strict golangci-lint v2 set; includes asciicheck for R18)
    - repo: local
      hooks:
          - id: golangci-lint
            name: golangci-lint
            entry: golangci-lint run
            language: system
            pass_filenames: false
            types: [go]

    # Go formatting (golangci-lint v2 owns gofumpt, goimports, gci, golines)
    - repo: local
      hooks:
          - id: golangci-fmt
            name: golangci-lint fmt
            entry: golangci-lint fmt --diff
            language: system
            pass_filenames: false
            types: [go]

    # 🧪 GitHub Actions validation
    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint
            types: [yaml]
            files: ".github/workflows/"
            exclude: ^.github/workflows/release.yml$

    # 📄 YAML style and correctness, every tracked YAML file rather than just
    # the workflows. Rev matches the yamllint pinned in mise.toml so the hook
    # and `just lint-yaml` cannot disagree about what passes.
    #
    # --strict promotes warnings to a non-zero exit; .yamllint.yml sets some
    # rules to `level: warning`, and without this they would print and pass.
    - repo: https://github.com/adrienverge/yamllint
      rev: v1.38.0
      hooks:
          - id: yamllint
            types: [yaml]
            args: [--strict, -c, .yamllint.yml]

    # 🐚 Shell script validation
    - repo: https://github.com/koalaman/shellcheck-precommit
      rev: v0.11.0
      hooks:
          - id: shellcheck
            types: [shell]
            exclude: ^.github/workflows/release.yml$

    # Go module hygiene: go.mod/go.sum must stay tidy
    - repo: local
      hooks:
          - id: go-mod-tidy
            name: go mod tidy
            entry: go mod tidy
            language: system
            pass_filenames: false
            files: '(^go\.mod$|^go\.sum$|\.go$)'

    # 📝 Markdown formatting and linting (temporarily disabled in CI due to path issues)
    - repo: https://github.com/executablebooks/mdformat
      rev: 1.0.0
      hooks:
          - id: mdformat
            additional_dependencies:
                - mdformat-gfm
                - mdformat-admon
                - mdformat-config
                - mdformat-footnote
                - mdformat-simple-breaks
                - mdformat-web
                - mdformat-ruff
                - mdformat-gfm-alerts
                - mdformat-toc
                - mdformat-front-matters
            types: [markdown]

    # 🔒 Vulnerability scan for Go dependencies. Also runs in CI, in ci.yml
    # (per change) and security.yml (per change and on a daily schedule).
    - repo: local
      hooks:
          - id: govulncheck
            name: govulncheck
            entry: govulncheck ./...
            language: system
            pass_filenames: false
            files: '(^go\.mod$|^go\.sum$)'
