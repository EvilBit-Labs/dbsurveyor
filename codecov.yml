# Coverage targets are stated explicitly rather than left to Codecov's "auto"
# mode. Auto compares a pull request against the base commit's coverage, which
# for this branch is a Rust tree that no longer exists -- the comparison is not
# meaningful, and it fails a diff at 81.48% for missing an inherited 81.70% by a
# fifth of a point. 80% is the project's stated minimum for both.
coverage:
    status:
        project:
            default:
                target: 80%
                threshold: 1%
        patch:
            default:
                target: 80%
                threshold: 1%

# The collector and postprocessor entry points are flag parsing and wiring (R9).
# Their behavior is covered through the packages they wire together.
ignore:
    - "tools/genschema/**"
